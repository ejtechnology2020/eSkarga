- name: Pakiety systemowe
  ansible.builtin.apt:
    # JDK (nie JRE): moduł mybatis dystrybucji Operaton wymaga jdk.attach i jdk.jdi
    name: [openjdk-21-jdk-headless, fonts-liberation, ocrmypdf, tesseract-ocr-pol, softhsm2, unzip]
    state: present
    update_cache: true
- name: Użytkownik usługi
  ansible.builtin.user: { name: "{{ eskarga_user }}", system: true, home: "{{ eskarga_home }}", shell: /usr/sbin/nologin }
# Archiwum operaton-bpm-wildfly-<wersja>.tar.gz nie ma katalogu nadrzędnego: serwer w server/wildfly-<wersja WildFly>/, SQL w sql/.
- name: Katalog rozpakowania dystrybucji Operaton
  ansible.builtin.file: { path: "/opt/operaton-dist-{{ operaton_version }}", state: directory, owner: "{{ eskarga_user }}" }
- name: Dystrybucja Operaton dla WildFly z Nexusa
  ansible.builtin.unarchive:
    src: "{{ nexus_base_url }}/operaton/operaton-bpm-wildfly-{{ operaton_version }}.tar.gz"
    dest: "/opt/operaton-dist-{{ operaton_version }}"
    remote_src: true
    creates: "{{ wildfly_home }}/bin/standalone.sh"
    owner: "{{ eskarga_user }}"
- name: Serwer WildFly z dystrybucji jako wildfly_home
  ansible.builtin.shell: "mv /opt/operaton-dist-{{ operaton_version }}/server/wildfly-* {{ wildfly_home }}"
  args: { creates: "{{ wildfly_home }}/bin/standalone.sh" }
- name: Bez przykładowej aplikacji procesowej (użytkownicy demo) i aplikacji powitalnej pod "/"
  ansible.builtin.shell: "rm -rf {{ wildfly_home }}/standalone/deployments/operaton-example-invoice-*.war {{ wildfly_home }}/standalone/deployments/operaton-welcome.war*"
  changed_when: false
- name: Sterownik PostgreSQL jako moduł
  ansible.builtin.template: { src: module-postgresql.xml.j2, dest: "{{ wildfly_home }}/modules/org/postgresql/main/module.xml", owner: "{{ eskarga_user }}" }
- name: Konfiguracja WildFly (źródło danych XA, logi JSON, HA)
  ansible.builtin.template: { src: eskarga.cli.j2, dest: "{{ wildfly_home }}/eskarga.cli", mode: "0640", owner: "{{ eskarga_user }}" }
- name: Zastosuj CLI (idempotentnie)
  ansible.builtin.command:
    cmd: "{{ wildfly_home }}/bin/jboss-cli.sh --file={{ wildfly_home }}/eskarga.cli"
    creates: "{{ wildfly_home }}/standalone/configuration/.eskarga-cli-applied"
  notify: restart wildfly
- name: Usługa systemd
  ansible.builtin.template: { src: wildfly.service.j2, dest: /etc/systemd/system/wildfly.service }
  notify: restart wildfly
- name: Włącz usługę
  ansible.builtin.systemd: { name: wildfly, enabled: true, state: started, daemon_reload: true }
