# Środowisko deweloperskie eSkarga obok ID-users (dev/docker-compose.yml projektu „id”, projekt Compose `id-users`):
# osobna nazwa projektu (brak kolizji nazw kontenerów, sieci i wolumenów) i porty hosta przesunięte względem ID-users
# (ID-users zajmuje 8080, 9990, 8180, 9000, 5432, 8025, 1025, 1389, 1636, 8200). Logowanie przez Keycloak ID-users
# (http://localhost:8180/realms/id-users); własny Keycloak tylko w profilu `oidc-local`. Rejestracja klientów eSkargi
# w ID-users: usługa `id-users-rejestracja` (profil `id-users`). Porty do zmiany w .env (PORT_*).
name: ${COMPOSE_PROJECT_NAME:-eskarga}

# Środowisko deweloperskie eSkarga (T-002, D11). Jedno polecenie: docker compose -f infra/docker/compose.yml up -d
# Sekrety i hasła w .env (skopiuj .env.example). Produkcja działa na VM (Ansible), nie na tych obrazach.

services:
  app:
    # Dystrybucja Operaton dla WildFly 41 (silnik współdzielony) + WAR-y kopiowane do deployments/ przy starcie (z target/)
    build:
      context: ./wildfly          # Dockerfile kopiuje entrypoint.sh i module-postgresql.xml względem tego katalogu
      args:
        OPERATON_VERSION: ${OPERATON_VERSION:-2.2.0}
        OPERATON_SHA256: ${OPERATON_SHA256:-6bc09729936ccf735c6352fe2d0f89cf3ca89d4d1aee9ad973d4d909d4297a0e}   # operaton-bpm-wildfly-<wersja>.tar.gz
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-eskarga}
      DB_USER_APP: ${DB_USER_APP:-eskarga_app}
      DB_PASSWORD_APP: ${DB_PASSWORD_APP:?ustaw w .env}
      ESKARGA_ENVIRONMENT: TEST
      # pamięć JVM WildFly (standalone.conf, obraz wildfly/Dockerfile): bez tego MaxMetaspaceSize=256m → OutOfMemoryError: Metaspace
      ESKARGA_JAVA_OPTS: ${ESKARGA_JAVA_OPTS:--Xms512m -Xmx2g -XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=1g}
      ESKARGA_FACES_STAGE: Development
      ESKARGA_SECURITY_MODE: ${ESKARGA_SECURITY_MODE:-oidc}
      ESKARGA_OIDC_ISSUER: http://localhost:8180/realms/id-users            # iss w tokenach = adres używany w przeglądarce
      ESKARGA_OIDC_PROVIDERURI: ${OIDC_PROVIDER_URI:-http://host.docker.internal:8180/realms/id-users}   # discovery z kontenera do Keycloaka ID-users na hoście; profil oidc-local: http://oidc:8180/realms/id-users
      ESKARGA_OIDC_CLIENTID: eskarga
      ESKARGA_PUBLIC_URL: ${ESKARGA_PUBLIC_URL:-http://localhost:8082/eskarga}   # post-logout-redirect-uri (oidc.json)
      ESKARGA_OIDC_CLIENTSECRET: ${OIDC_CLIENT_SECRET:?ustaw w .env}
      ESKARGA_OIDC_CLIENTAUTH: ${OIDC_CLIENT_AUTH:-auto}      # auto: private_key_jwt, gdy w ID_USERS_KLUCZE_DIR jest eskarga.key.pem (rejestracja T-037 projektu id); jwt | secret
      # aud asercji private_key_jwt = publiczny adres tokenu (Keycloak porównuje z adresem frontowym realmu); entrypoint wyprowadza z ESKARGA_OIDC_ISSUER
      ESKARGA_OIDC_ROLESCLAIM: ${OIDC_ROLES_CLAIM:-resource_access.eskarga.roles}
      ESKARGA_OIDC_MFACLAIM: ${OIDC_MFA_CLAIM:-acr}
      ESKARGA_OIDC_MFAREQUIREDVALUE: ${OIDC_MFA_VALUE:-mfa,wysoki}
      ESKARGA_WORKERS_JWKSURI: ${OIDC_PROVIDER_URI:-http://host.docker.internal:8180/realms/id-users}/protocol/openid-connect/certs
      ESKARGA_DOCS_TSAURL: http://tsa:3180/
      ESKARGA_DOCS_CONVERTERURL: http://konwerter:3000       # konwersja DOC/DOCX → PDF/A (Gotenberg, ADR 0026)
      ESKARGA_DOCS_TRUSTSTORE: ${ESKARGA_DOCS_TRUSTSTORE:-}           # dev: /opt/eskarga/podpis/truststore.p12 (infra\windows\podpis.cmd)
      ESKARGA_DOCS_TRUSTSTOREPASSWORD: ${ESKARGA_DOCS_TRUSTSTOREPASSWORD:-}
      ESKARGA_S3_ENDPOINT: http://s3:9000
      ESKARGA_S3_BUCKET: eskarga-akta
      ESKARGA_S3_ACCESSKEY: ${S3_ACCESS_KEY:?ustaw w .env}
      ESKARGA_S3_SECRETKEY: ${S3_SECRET_KEY:?ustaw w .env}
      ESKARGA_S3_SSE: ${ESKARGA_S3_SSE:-false}          # SSE-S3 tylko gdy serwer dev je obsługuje; produkcja: true
      ESKARGA_S3_LOCKRETENTIONYEARS: ${ESKARGA_S3_LOCKRETENTIONYEARS:-10}   # blokada COMPLIANCE podpisanych czynności (ADR 0022)
      ESKARGA_DEMO_TODAY: ${ESKARGA_DEMO_TODAY:-}
      ESKARGA_SEARCH_URL: http://opensearch:9200
      ESKARGA_DOCS_URL: http://localhost:8080/eskarga-docs/api
      ESKARGA_DOCS_OIDC_TOKENURL: ${OIDC_PROVIDER_URI:-http://host.docker.internal:8180/realms/id-users}/protocol/openid-connect/token
      ESKARGA_DOCS_OIDC_CLIENTID: eskarga
      ESKARGA_DOCS_OIDC_CLIENTSECRET: ${OIDC_CLIENT_SECRET:?ustaw w .env}
      ESKARGA_HSM_MODE: ${ESKARGA_HSM_MODE:-off}
      ESKARGA_PDF_FONTDIR: /usr/share/fonts/truetype/liberation
      ESKARGA_METRICS_ALLOW: "*"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT_APP:-8082}:8080"          # aplikacja /eskarga, Cockpit /operaton (ID-users zajmuje 8080)
      - "${PORT_APP_ADMIN:-9992}:9990"    # konsola WildFly (tylko dev; ID-users zajmuje 9990)
    volumes:
      # katalogi target/ (nie pojedyncze pliki): mvn clean usuwa WAR w trakcie builda, a montowany plik wskazywałby skasowany
      # i-węzeł – skaner WildFly cofał wdrożenie (WFLYDS0008 FileNotFoundException). entrypoint.sh kopiuje WAR-y przy każdym starcie.
      - ../../app/target:/opt/eskarga/wary/app:ro
      - ../../docs-service/target:/opt/eskarga/wary/docs:ro
      # klucze prywatne z rejestracji eSkargi w ID-users (npm --prefix frontend run aplikacje:eskarga w projekcie id): eskarga.key.pem, eskarga-workers.key.pem, *.kid
      - ${ID_USERS_KLUCZE_DIR:-../../../id/frontend/narzedzia/wyniki/eskarga}:/opt/eskarga/klucze:ro
      - ./wildfly/eskarga-datasource.cli:/opt/operaton/eskarga-datasource.cli:ro
      # podpis na dev: magazyn zaufania (certyfikat testowy sędziego + certyfikat TSA dev) z infra\windows\podpis.cmd (katalog poza Gitem)
      - ./.local/podpis:/opt/eskarga/podpis:ro
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      tsa:
        condition: service_started
      konwerter:
        condition: service_started
    healthcheck:
      # gotowość aplikacji (HealthServlet: baza, S3, silnik); Cockpit Operaton bez silnika logował pełny stos co 20 s
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/eskarga/health"]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 90s

  flyway:
    # Migracje schematu repertorium rolą migracji – przed startem aplikacji (T-003, ADR 0016). Rola aplikacji nie ma praw DDL.
    image: flyway/flyway:11-alpine
    command: -connectRetries=30 migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-eskarga}
      FLYWAY_USER: ${DB_USER_MIGRATION:-eskarga_migration}
      FLYWAY_PASSWORD: ${DB_PASSWORD_MIGRATION:?ustaw w .env}
      FLYWAY_SCHEMAS: repertorium
      FLYWAY_DEFAULT_SCHEMA: repertorium
      FLYWAY_LOCATIONS: filesystem:/flyway/sql/migration,filesystem:/flyway/sql/migration-postgresql
      FLYWAY_PLACEHOLDERS_APP_ROLE: ${DB_USER_APP:-eskarga_app}
    volumes:
      - ../../app/src/main/resources/db:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eskarga}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw w .env}
      DB_USER_APP: ${DB_USER_APP:-eskarga_app}
      DB_PASSWORD_APP: ${DB_PASSWORD_APP:?ustaw w .env}
      DB_USER_MIGRATION: ${DB_USER_MIGRATION:-eskarga_migration}
      DB_PASSWORD_MIGRATION: ${DB_PASSWORD_MIGRATION:?ustaw w .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    ports:
      - "${PORT_DB:-5433}:5432"           # ID-users zajmuje 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    # Repozytorium dokumentów S3 z Object Lock (D5, ADR 0022): RustFS (Apache 2.0, zamiennik MinIO – obrazy MinIO zniknęły
    # z Docker Hub 2025/2026). API :9000, konsola :9001, dane w /data. Kubełek z Object Lock zakłada usługa s3-init.
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.4}
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?ustaw w .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?ustaw w .env}
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"   # jeden wolumen – tylko dev
    ports:
      - "${PORT_S3:-9100}:9000"           # S3 API (9000 zajmuje panel zdrowia Keycloaka ID-users)
      - "${PORT_S3_CONSOLE:-9101}:9001"   # konsola RustFS (tylko dev)
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18

  s3-init:
    # Kubełek eskarga-akta: Object Lock + wersjonowanie, kontrola egzekwowania blokady COMPLIANCE (infra/docker/s3/init-bucket.sh)
    image: ${AWSCLI_IMAGE:-amazon/aws-cli:2.39.4}
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?ustaw w .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?ustaw w .env}
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET: eskarga-akta
    entrypoint: ["/bin/sh", "/init-bucket.sh"]
    volumes:
      - ./s3/init-bucket.sh:/init-bucket.sh:ro
    depends_on:
      s3:
        condition: service_healthy

  opensearch:
    build:
      context: ./opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?ustaw w .env}
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "${PORT_OPENSEARCH:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  softhsm:
    # Emulator PKCS#11 (D12); produkcja: para sieciowych HSM
    build:
      context: ./softhsm
    volumes:
      - softhsm-tokens:/var/lib/softhsm/tokens
    environment:
      SOFTHSM_SO_PIN: ${SOFTHSM_SO_PIN:?ustaw w .env}
      SOFTHSM_USER_PIN: ${SOFTHSM_USER_PIN:?ustaw w .env}

  oidc:
    # Keycloak zgodny z kontraktem ID-users (realm id-users, klient eskarga code+PKCE, role pod resource_access, acr haslo/mfa/wysoki,
    # back-channel logout z sid, konto serwisowe workerów). Port 8180 jak w kontrakcie dev.
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.2}
    # hostname = adres z przeglądarki (issuer); backchannel-dynamic = token/JWKS pod adresem, z którego pyta kontener (oidc:8180)
    command: ["start-dev", "--http-port=8180", "--import-realm", "--hostname=http://localhost:8180", "--hostname-backchannel-dynamic=true"]
    profiles: ["oidc-local"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?ustaw w .env}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/id-users-realm.json:/opt/keycloak/data/import/id-users-realm.json:ro
    ports:
      - "${PORT_OIDC_LOCAL:-8181}:8180"   # tylko profil oidc-local; ID-users ma Keycloak na 8180

  tsa:
    # Deweloperski serwer znaczników czasu RFC 3161 (ADR 0023); prod: kwalifikowany TSA (ESKARGA_DOCS_TSAURL).
    build: ./tsa
    ports:
      - "${PORT_TSA:-3180}:3180"
    volumes:
      - tsa-data:/tsa/data

  konwerter:
    # Konwersja DOC/DOCX → PDF/A dla usługi dokumentów (ADR 0026): LibreOffice za API HTTP w osobnym kontenerze (izolacja niezaufanych
    # plików od WildFly). Tylko w sieci Compose – bez portu na hoście; prod: ta sama usługa jako kontener Podman w systemd (rola Ansible).
    image: ${GOTENBERG_IMAGE:-gotenberg/gotenberg:8.21.1}
    command: ["gotenberg", "--api-timeout=180s", "--libreoffice-max-queue-size=20", "--libreoffice-auto-start=true"]
    mem_limit: 1g

  id-users-rejestracja:
    # Rejestruje klientów eSkargi (eskarga, eskarga-workers) w Keycloaku ID-users działającym na hoście i nadaje role
    # użytkownikom testowym ID-users (tylko dev; docelowo portal integratora PU-INT-01). Uruchomienie:
    #   docker compose --profile id-users run --rm id-users-rejestracja
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.2}
    profiles: ["id-users"]
    entrypoint: ["bash", "/skrypty/zarejestruj-w-id-users.sh"]
    environment:
      KEYCLOAK_URL: ${OIDC_PROVIDER_URI_ADMIN:-http://host.docker.internal:8180}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?hasło administratora Keycloaka ID-users (dev/.env projektu id)}
      ESKARGA_PUBLIC_URL: ${ESKARGA_PUBLIC_URL:-http://localhost:8082/eskarga}
      ESKARGA_BACKCHANNEL_URL: ${ESKARGA_BACKCHANNEL_URL:-http://host.docker.internal:8082/eskarga/oidc/backchannel-logout}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?ustaw w .env}
      OIDC_WORKERS_SECRET: ${OIDC_WORKERS_SECRET:?ustaw w .env}
      ESKARGA_PKCE: ${ESKARGA_PKCE-S256}   # wymóg PKCE klienta eskarga; pusty = brak wymogu (decyzja, ADR 0002)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./keycloak/zarejestruj-w-id-users.sh:/skrypty/zarejestruj-w-id-users.sh:ro
    restart: "no"

  wiremock:
    # Zaślepki systemów zewnętrznych: e-Doręczenia, operator pocztowy, repertoria SK/K/U (D7)
    image: wiremock/wiremock:3.10.0
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ./wiremock:/home/wiremock:ro
    ports:
      - "${PORT_WIREMOCK:-8089}:8080"

  workers:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ../..
      dockerfile: infra/docker/workers/Dockerfile
    environment:
      ESKARGA_ENGINE_REST: http://app:8080/engine-rest
      ESKARGA_OIDC_TOKEN_URL: ${OIDC_PROVIDER_URI:-http://host.docker.internal:8180/realms/id-users}/protocol/openid-connect/token
      ESKARGA_OIDC_CLIENT_ID: eskarga-workers
      ESKARGA_OIDC_CLIENT_SECRET: ${OIDC_WORKERS_SECRET:?ustaw w .env}
      ESKARGA_OIDC_PRIVATE_KEY_PEM: /opt/eskarga/klucze/eskarga-workers.key.pem   # private_key_jwt, gdy plik istnieje (rejestracja T-037)
      ESKARGA_OIDC_ASSERTION_AUDIENCE: http://localhost:8180/realms/id-users/protocol/openid-connect/token   # aud asercji = publiczny adres tokenu ID-users
      ESKARGA_APP_API: http://app:8080/eskarga/api
      ESKARGA_DOCS_API: http://app:8080/eskarga-docs/api
      ESKARGA_EXTERNAL_BASE_URL: http://wiremock:8080
      ESKARGA_WORKER_ID: eskarga-worker-dev
    volumes:
      - ${ID_USERS_KLUCZE_DIR:-../../../id/frontend/narzedzia/wyniki/eskarga}:/opt/eskarga/klucze:ro
    depends_on:
      app:
        condition: service_healthy

  prometheus:
    # Monitoring dev (T-054): metryki aplikacji i workerów, reguły alertów; Grafana z panelem eSkarga.
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "${PORT_PROMETHEUS:-9090}:9090"
  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?ustaw w .env}
    volumes:
      - ../monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/eskarga.json:ro
    ports:
      - "${PORT_GRAFANA:-3000}:3000"

volumes:
  db-data:
  s3-data:
  tsa-data:
  opensearch-data:
  softhsm-tokens:
