# Środowisko deweloperskie eSkarga (T-002, D11). Jedno polecenie: docker compose -f infra/docker/compose.yml up -d
# Sekrety i hasła w .env (skopiuj .env.example). Produkcja działa na VM (Ansible), nie na tych obrazach.
name: eskarga

services:
  app:
    # Dystrybucja Operaton dla WildFly 41 (silnik współdzielony) + WAR aplikacji montowany do deployments/
    build:
      context: .
      dockerfile: wildfly/Dockerfile
      args:
        OPERATON_VERSION: ${OPERATON_VERSION:-2.2.0}
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-eskarga}
      DB_USER_APP: ${DB_USER_APP:-eskarga_app}
      DB_PASSWORD_APP: ${DB_PASSWORD_APP:?ustaw w .env}
      ESKARGA_ENVIRONMENT: TEST
      ESKARGA_FACES_STAGE: Development
      ESKARGA_SECURITY_MODE: ${ESKARGA_SECURITY_MODE:-oidc}
      ESKARGA_OIDC_ISSUER: http://localhost:8180/realms/id-users            # iss w tokenach = adres używany w przeglądarce
      ESKARGA_OIDC_PROVIDERURI: ${OIDC_PROVIDER_URI:-http://oidc:8180/realms/id-users}   # discovery z kontenera; dla Keycloaka na hoście: http://host.docker.internal:8180/realms/id-users
      ESKARGA_OIDC_CLIENTID: eskarga
      ESKARGA_OIDC_CLIENTSECRET: ${OIDC_CLIENT_SECRET:?ustaw w .env}
      ESKARGA_OIDC_ROLESCLAIM: ${OIDC_ROLES_CLAIM:-resource_access.eskarga.roles}
      ESKARGA_OIDC_MFACLAIM: ${OIDC_MFA_CLAIM:-acr}
      ESKARGA_OIDC_MFAREQUIREDVALUE: ${OIDC_MFA_VALUE:-mfa,wysoki}
      ESKARGA_WORKERS_JWKSURI: ${OIDC_PROVIDER_URI:-http://oidc:8180/realms/id-users}/protocol/openid-connect/certs
      ESKARGA_DOCS_TSAURL: http://tsa:3180/
      ESKARGA_DOCS_TRUSTSTORE: ${ESKARGA_DOCS_TRUSTSTORE:-}
      ESKARGA_S3_ENDPOINT: http://s3:9000
      ESKARGA_S3_BUCKET: eskarga-akta
      ESKARGA_S3_ACCESSKEY: ${S3_ACCESS_KEY:?ustaw w .env}
      ESKARGA_S3_SECRETKEY: ${S3_SECRET_KEY:?ustaw w .env}
      ESKARGA_DEMO_TODAY: ${ESKARGA_DEMO_TODAY:-}
      ESKARGA_SEARCH_URL: http://opensearch:9200
      ESKARGA_DOCS_URL: http://localhost:8080/eskarga-docs/api
      ESKARGA_DOCS_OIDC_TOKENURL: ${OIDC_PROVIDER_URI:-http://oidc:8180/realms/id-users}/protocol/openid-connect/token
      ESKARGA_DOCS_OIDC_CLIENTID: eskarga
      ESKARGA_DOCS_OIDC_CLIENTSECRET: ${OIDC_CLIENT_SECRET:?ustaw w .env}
      ESKARGA_HSM_MODE: ${ESKARGA_HSM_MODE:-off}
      ESKARGA_PDF_FONTDIR: /usr/share/fonts/truetype/liberation
      ESKARGA_METRICS_ALLOW: "*"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"   # aplikacja /eskarga, Cockpit /operaton
      - "9990:9990"   # konsola WildFly (tylko dev)
    volumes:
      - ../../app/target/eskarga.war:/opt/operaton/standalone/deployments/eskarga.war:ro
      - ../../docs-service/target/eskarga-docs-service.war:/opt/operaton/standalone/deployments/eskarga-docs-service.war:ro
      - ./wildfly/eskarga-datasource.cli:/opt/operaton/eskarga-datasource.cli:ro
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      oidc:
        condition: service_started
      s3-init:
        condition: service_completed_successfully
      tsa:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/operaton/app/cockpit/"]
      interval: 20s
      timeout: 5s
      retries: 15

  flyway:
    # Migracje schematu repertorium rolą migracji – przed startem aplikacji (T-003, ADR 0016). Rola aplikacji nie ma praw DDL.
    image: flyway/flyway:11-alpine
    command: -connectRetries=30 migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-eskarga}
      FLYWAY_USER: ${DB_USER_MIGRATION:-eskarga_migration}
      FLYWAY_PASSWORD: ${DB_PASSWORD_MIGRATION:?ustaw w .env}
      FLYWAY_SCHEMAS: repertorium
      FLYWAY_DEFAULT_SCHEMA: repertorium
      FLYWAY_LOCATIONS: filesystem:/flyway/sql/migration,filesystem:/flyway/sql/migration-postgresql
      FLYWAY_PLACEHOLDERS_APP_ROLE: ${DB_USER_APP:-eskarga_app}
    volumes:
      - ../../app/src/main/resources/db:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eskarga}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw w .env}
      DB_USER_APP: ${DB_USER_APP:-eskarga_app}
      DB_PASSWORD_APP: ${DB_PASSWORD_APP:?ustaw w .env}
      DB_USER_MIGRATION: ${DB_USER_MIGRATION:-eskarga_migration}
      DB_PASSWORD_MIGRATION: ${DB_PASSWORD_MIGRATION:?ustaw w .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    # Repozytorium dokumentów S3 z Object Lock (D5, ADR 0022): MinIO; kubełek zakłada init z --with-lock.
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?ustaw w .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?ustaw w .env}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # konsola (tylko dev)
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  s3-init:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?ustaw w .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?ustaw w .env}
    entrypoint: ["/bin/sh", "/init-bucket.sh"]
    volumes:
      - ./minio/init-bucket.sh:/init-bucket.sh:ro
    depends_on:
      s3:
        condition: service_healthy

  opensearch:
    build:
      context: ./opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?ustaw w .env}
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  softhsm:
    # Emulator PKCS#11 (D12); produkcja: para sieciowych HSM
    build:
      context: ./softhsm
    volumes:
      - softhsm-tokens:/var/lib/softhsm/tokens
    environment:
      SOFTHSM_SO_PIN: ${SOFTHSM_SO_PIN:?ustaw w .env}
      SOFTHSM_USER_PIN: ${SOFTHSM_USER_PIN:?ustaw w .env}

  oidc:
    # Keycloak zgodny z kontraktem ID-users (realm id-users, klient eskarga code+PKCE, role pod resource_access, acr haslo/mfa/wysoki,
    # back-channel logout z sid, konto serwisowe workerów). Port 8180 jak w kontrakcie dev.
    image: quay.io/keycloak/keycloak:26.3
    # hostname = adres z przeglądarki (issuer); backchannel-dynamic = token/JWKS pod adresem, z którego pyta kontener (oidc:8180)
    command: ["start-dev", "--http-port=8180", "--import-realm", "--hostname=http://localhost:8180", "--hostname-backchannel-dynamic=true"]
    profiles: ["", "oidc-local"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?ustaw w .env}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/id-users-realm.json:/opt/keycloak/data/import/id-users-realm.json:ro
    ports:
      - "8180:8180"

  tsa:
    # Deweloperski serwer znaczników czasu RFC 3161 (ADR 0023); prod: kwalifikowany TSA (ESKARGA_DOCS_TSAURL).
    build: ./tsa
    ports:
      - "3180:3180"
    volumes:
      - tsa-data:/tsa/data

  wiremock:
    # Zaślepki systemów zewnętrznych: e-Doręczenia, operator pocztowy, repertoria SK/K/U (D7)
    image: wiremock/wiremock:3.10.0
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ./wiremock:/home/wiremock:ro
    ports:
      - "8089:8080"

  workers:
    build:
      context: ../..
      dockerfile: infra/docker/workers/Dockerfile
    environment:
      ESKARGA_ENGINE_REST: http://app:8080/engine-rest
      ESKARGA_OIDC_TOKEN_URL: ${OIDC_PROVIDER_URI:-http://oidc:8180/realms/id-users}/protocol/openid-connect/token
      ESKARGA_OIDC_CLIENT_ID: eskarga-workers
      ESKARGA_OIDC_CLIENT_SECRET: ${OIDC_WORKERS_SECRET:?ustaw w .env}
      ESKARGA_APP_API: http://app:8080/eskarga/api
      ESKARGA_DOCS_API: http://app:8080/eskarga-docs/api
      ESKARGA_EXTERNAL_BASE_URL: http://wiremock:8080
      ESKARGA_WORKER_ID: eskarga-worker-dev
      ESKARGA_EXTERNAL_BASE_URL: http://wiremock:8080
      ESKARGA_OIDC_TOKEN_URL: ""
    depends_on:
      app:
        condition: service_healthy

  prometheus:
    # Monitoring dev (T-054): metryki aplikacji i workerów, reguły alertów; Grafana z panelem eSkarga.
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "9090:9090"
  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?ustaw w .env}
    volumes:
      - ../monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/eskarga.json:ro
    ports:
      - "3000:3000"

volumes:
  db-data:
  s3-data:
  tsa-data:
  opensearch-data:
  softhsm-tokens:
