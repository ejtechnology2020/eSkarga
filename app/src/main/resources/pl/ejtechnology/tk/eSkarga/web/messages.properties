# JSF – komunikaty standardowe po polsku
jakarta.faces.component.UIInput.REQUIRED={0}: pole jest wymagane.
jakarta.faces.component.UIInput.CONVERSION={0}: wartość ma niepoprawny format.
jakarta.faces.converter.DateTimeConverter.DATE={2}: podaj datę w formacie DD.MM.RRRR.
jakarta.faces.converter.DateTimeConverter.DATE_detail={2}: „{0}” nie jest poprawną datą. Przykład: {1}.
jakarta.faces.converter.IntegerConverter.INTEGER={2}: podaj liczbę całkowitą.
jakarta.faces.converter.IntegerConverter.INTEGER_detail={2}: „{0}” nie jest liczbą całkowitą. Przykład: {1}.
jakarta.faces.validator.LengthValidator.MAXIMUM={1}: tekst jest dłuższy niż {0} znaków.
jakarta.faces.validator.LengthValidator.MINIMUM={1}: tekst jest krótszy niż {0} znaków.
