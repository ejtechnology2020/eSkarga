<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets">
  <!-- Stopka: wersja systemu i środowisko; „TEST” jako wyraźny znacznik poza produkcją. -->
  <footer class="e-foot">
    <span>#{msg['app.name']} · #{fmt.msg('app.version', appInfo.version)}</span>
    <span class="#{appInfo.footerEnvClass}">#{msg['app.env.'.concat(appInfo.environment)]}</span>
    <span class="sp"></span>
    <!-- identyfikator ekranu z inwentarza briefu (S-01…S-27) – przeniesiony z nagłówka widoku do stopki (05.11.2026) -->
    <h:panelGroup rendered="#{not empty menu.current}" styleClass="mono mut" pt:aria-label="Identyfikator ekranu" xmlns:pt="jakarta.faces.passthrough">#{menu.current.briefId()}</h:panelGroup>
    <span><ui:insert name="footerNote">#{msg['app.help']}</ui:insert></span>
  </footer>
</ui:composition>
