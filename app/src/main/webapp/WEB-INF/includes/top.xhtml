<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces"
                xmlns:tk="jakarta.faces.composite/tk">
  <!-- Górny pasek (p:toolbar w briefie): nazwa prowadzi do pulpitu, szybkie wyszukiwanie sygnatury (skrót /),
       powiadomienia z licznikiem, użytkownik z rolą, wybór roli przy wielu rolach, wylogowanie.
       Pas „ŚRODOWISKO TESTOWE” tylko poza produkcją. -->
  <h:panelGroup layout="block" styleClass="e-env" rendered="#{appInfo.test}">
    <span role="note">#{msg['app.testBanner']}</span>
  </h:panelGroup>
  <header class="e-top">
    <a class="e-skip" href="#tresc">#{msg['app.skip']}</a>
    <h:link outcome="/pulpit" styleClass="e-brand"><span class="logo" aria-hidden="true"></span>#{msg['app.name']}</h:link>
    <h:form id="qs" styleClass="e-qs" role="search" prependId="false">
      <h:outputLabel styleClass="sr" for="qs-sig" value="#{msg['app.quickSearch']}" />
      <span class="wrap">
        <tk:icon name="search" />
        <h:inputText id="qs-sig" value="#{quickSearch.query}" type="search" pt:placeholder="#{msg['app.quickSearch.placeholder']}"
                     xmlns:pt="jakarta.faces.passthrough" />
      </span>
      <span class="kbd" aria-hidden="true">/</span>
      <h:commandButton value="Szukaj" action="#{quickSearch.go}" styleClass="sr" />
    </h:form>
    <span class="sp"></span>
    <h:link outcome="/pulpit" styleClass="ibtn e-bell" pt:aria-label="#{fmt.msg('app.notifications', currentUser.notifications)}"
            xmlns:pt="jakarta.faces.passthrough">
      <tk:icon name="bell" />
      <span class="cnt" aria-hidden="true">#{currentUser.notifications}</span>
    </h:link>
    <h:panelGroup rendered="#{currentUser.multiRole}" styleClass="fld" layout="block" style="flex-direction: row; align-items: center; gap: 8px;">
      <h:outputLabel for="tb-rola" styleClass="mut" value="#{msg['app.role']}" style="font-weight: 600;" />
      <h:form id="rolaForm" prependId="false" style="display: contents;">
        <!-- p:selectOneMenu + p:ajax: zdarzenie rejestrowane z nonce CSP (inline onchange był blokowany); po wyborze przeładowanie ekranu -->
        <p:selectOneMenu id="tb-rola" styleClass="e-role" value="#{currentUser.role}">
          <f:selectItems value="#{currentUser.roles}" var="r" itemLabel="#{msg['role.'.concat(r)]}" itemValue="#{r}" />
          <p:ajax listener="#{currentUser.applyRole}" />
        </p:selectOneMenu>
      </h:form>
    </h:panelGroup>
    <h:panelGroup rendered="#{currentUser.authenticated}" layout="block" styleClass="e-user">
      <span class="e-av" aria-hidden="true">#{currentUser.initials}</span>
      <span class="who"><b>#{currentUser.displayName}</b><small>#{currentUser.roleLabel}</small></span>
    </h:panelGroup>
    <!-- wylogowanie zwykłym odnośnikiem (GET /wylogowanie): postback h:commandLink nie niesie nonce CSP PrimeFaces (core.js dodaje go tylko
         do żądań PrimeFaces) i kończył się „CSP nonce mismatch” -->
    <h:outputLink value="#{request.contextPath}/wylogowanie" styleClass="btn q" rendered="#{currentUser.authenticated}">
      <tk:icon name="logout" /> #{msg['app.logout']}
    </h:outputLink>
  </header>
</ui:composition>
