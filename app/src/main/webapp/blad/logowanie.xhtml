<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition template="/WEB-INF/templates/system.xhtml"
                xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets" xmlns:tk="jakarta.faces.composite/tk">
  <!-- Błąd zwrócony przez ID-users na /callback (error, error_description) – bez danych sesji; przyczyna oczyszczona w LoginTriggerServlet. -->
  <ui:param name="bare" value="#{true}" />
  <ui:define name="title">Logowanie nie powiodło się</ui:define>
  <ui:define name="content">
    <tk:icon name="timer" size="xxl" color="#233A6B" />
    <h1 id="sys-h" class="h1-26">#{msg['sys.login.title']}</h1>
    <p>#{msg['sys.login.text']}</p>
    <dl class="dl"><dt>#{msg['sys.login.reason']}</dt><dd class="mono"><b>#{requestScope.oidcBlad}</b><h:outputText value=" – #{requestScope.oidcOpis}" rendered="#{not empty requestScope.oidcOpis}" /></dd></dl>
    <div class="row"><h:outputLink value="#{request.contextPath}/" styleClass="btn p">#{msg['sys.login.retry']}</h:outputLink></div>
  </ui:define>
</ui:composition>
