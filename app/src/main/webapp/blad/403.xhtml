<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition template="/WEB-INF/templates/system.xhtml"
                xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets" xmlns:tk="jakarta.faces.composite/tk">
  <!-- Brak uprawnień do sprawy: sygnatura i informacja, kto może nadać dostęp – bez danych sprawy. -->
  <ui:define name="title">Brak uprawnień</ui:define>
  <ui:define name="content">
    <tk:icon name="lock" size="xxl" color="#233A6B" />
    <h1 id="sys-h" class="h1-26">#{fmt.msg('sys.403.title', empty param.sygnatura ? 'Ts 315/26' : param.sygnatura)}</h1>
    <p>#{msg['sys.403.text']}</p>
    <dl class="dl"><dt>#{msg['sys.403.grants']}</dt><dd>sędzia sprawozdawca tej sprawy albo kierownik wydziału Ewa Szablon (wewn. 2140)</dd></dl>
    <div class="row"><button type="button" class="btn p">#{msg['sys.403.request']}</button><h:link outcome="/pulpit" styleClass="btn" value="#{msg['sys.backToDesk']}" /></div>
  </ui:define>
</ui:composition>
