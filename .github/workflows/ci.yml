# Potok CI (T-006, ADR 0005): build + testy jednostkowe i procesowe na każdy push/PR, testy integracyjne (Testcontainers)
# i skan zależności (OWASP Dependency-Check, CVSS ≥ 7 przerywa build) oraz artefakty z sumami kontrolnymi.
name: ci
on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # cotygodniowy skan zależności
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Czcionki do testów PDF/A (Liberation)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation
      - name: Build i testy
        run: mvn -B -ntp verify
      - name: Artefakty z sumami kontrolnymi
        run: |
          mkdir -p dist
          cp app/target/eskarga.war docs-service/target/eskarga-docs-service.war workers/target/eskarga-workers.jar dist/
          cp -r workers/target/lib dist/workers-lib
          (cd dist && sha256sum eskarga.war eskarga-docs-service.war eskarga-workers.jar > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with: { name: "eskarga-${{ github.sha }}", path: dist, retention-days: 14 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: raporty-testow, path: "**/target/surefire-reports/*.xml", retention-days: 7 }
  it:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: postgres-ci, POSTGRES_DB: eskarga_it }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Role bazy jak w dev (aplikacja bez UPDATE/DELETE, migracje osobno)
        run: PGPASSWORD=postgres-ci psql -h localhost -U postgres -d eskarga_it -v ON_ERROR_STOP=1 -f app/src/test/resources/it/init-roles.sql
      - name: Testy serwisów na PostgreSQL z rolą aplikacji (ADR 0011, T-058)
        run: >-
          mvn -B -ntp -pl app -am test
          -Deskarga.test.jdbcUrl="jdbc:postgresql://localhost:5432/eskarga_it?currentSchema=repertorium"
          -Deskarga.test.user=eskarga_app -Deskarga.test.password=aplikacja-test
          -Deskarga.test.migrationUser=eskarga_migration -Deskarga.test.migrationPassword=migracja-test
      - name: Testy integracyjne (PostgreSQL w Testcontainers)
        run: mvn -B -ntp verify -Pit -DskipTests=false
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: raporty-testow-postgresql, path: "**/target/surefire-reports/*.xml", retention-days: 7 }
  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: OWASP Dependency-Check (CVSS ≥ 7 przerywa build)
        # Klucz NVD (bezpłatny: https://nvd.nist.gov/developers/request-an-api-key) jako sekret repozytorium NVD_API_KEY
        # przyspiesza pobranie bazy CVE. Bez sekretu skan działa wolniej, ale pusty -Dnvd.api.key="" przerywa go
        # („Invalid API Key, length of 0”), więc parametr przekazujemy tylko gdy sekret jest ustawiony.
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: ${{ secrets.NVD_API_KEY == '' }}   # bez klucza pobieranie NVD bywa odrzucane (limity) – nie czerwień CI
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            mvn -B -ntp verify -Psecurity -DskipTests -Dnvd.api.key="$NVD_API_KEY"
          else
            echo "::warning::Brak sekretu NVD_API_KEY – skan OWASP bez klucza (wolniejsze pobieranie NVD)."
            mvn -B -ntp verify -Psecurity -DskipTests
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: dependency-check, path: "**/target/dependency-check-report.html", retention-days: 30 }
  widget:
    # Widżet PDF (pdf.js) w prawdziwym Chromium pod CSP z web.xml – bez WildFly (ui-tests, projekt „widget”, T-058)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: ui-tests/package-lock.json }
      - name: Zależności i Chromium Playwright
        run: cd ui-tests && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Test widżetu PDF (osadzony w stronie i wstawiony po AJAX)
        run: cd ui-tests && npx playwright test --project widget
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: raport-widget, path: ui-tests/playwright-report, retention-days: 7 }
